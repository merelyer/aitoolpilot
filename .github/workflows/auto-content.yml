name: Auto Content Engine
on:
  schedule:
    - cron: '15 */8 * * *'
  workflow_dispatch:
concurrency:
  group: auto-content-engine
  cancel-in-progress: false
env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests
          node --test tests/test_pages_artifact.cjs
      - run: python run.py --once
      - run: |
          git config user.name "AI Bot"
          git config user.email "bot@aitoolpilot.com"
          git add site/ data/
          git diff --staged --quiet || git commit -m "Auto content $(date +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: 'site' }
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v8
        with:
          script: |
            const waitForPagesArtifact = require('./.github/scripts/wait-for-pages-artifact.cjs');
            await waitForPagesArtifact({github, context, core});
      - uses: actions/deploy-pages@v4
