name: Auto Content Engine
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
concurrency:
  group: auto-content-engine
  cancel-in-progress: false
env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - run: python run.py --once
      - run: |
          git config user.name "AI Bot"
          git config user.email "bot@aitoolpilot.com"
          git add site/ data/
          git diff --staged --quiet || git commit -m "Auto content $(date +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: 'site' }

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
